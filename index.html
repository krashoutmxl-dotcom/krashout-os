<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://cdn.shopify.com; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0B0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Krashout OS">
<title>Krashout OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Entrada: usuario Panini + contraseña -->
<section class="login" id="login">
  <form class="lbox" id="flogin" autocomplete="on">
    <div class="logo">KRASH<span>OUT</span> OS</div>
    <h1 id="ltitle">Entrar</h1>
    <p class="lsub" id="lsub">Usuario y contraseña.</p>
    <label class="fl">Usuario
      <input id="luser" name="username" autocomplete="username" value="Panini" maxlength="30" required>
    </label>
    <label class="fl">Contraseña
      <input id="lpass" name="password" type="password" autocomplete="current-password" maxlength="128" required>
    </label>
    <label class="fl" id="lpass2w" hidden>Repite la contraseña
      <input id="lpass2" type="password" autocomplete="new-password" maxlength="128">
    </label>
    <button class="btn lime big" type="submit" id="lbtn">Entrar</button>
    <div class="lmsg" id="lmsg" role="status" aria-live="polite"></div>
    <button class="linkbtn" type="button" id="lforgot" hidden>Olvidé mi contraseña</button>
  </form>
</section>

<div class="app" id="app" hidden>
  <!-- Riel izquierdo: tres bolitas -->
  <nav class="rail" id="rail" aria-label="Menú">
    <a class="rlogo" href="#/" aria-label="Inicio">K</a>
    <div class="dots">
      <button type="button" class="bolita" data-b="plan" aria-label="Plan"><i></i><span>Plan</span></button>
      <button type="button" class="bolita" data-b="tienda" aria-label="Tienda"><i></i><span>Tienda</span></button>
      <button type="button" class="bolita" data-b="centro" aria-label="Centro"><i></i><span>Centro</span></button>
    </div>
    <button type="button" class="rlock" id="lock" aria-label="Cerrar sesión" title="Cerrar sesión">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </button>
  </nav>

  <!-- Cajón que sale al picar una bolita -->
  <aside class="drawer" id="drawer" aria-label="Contenido de la bolita" hidden></aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="main" tabindex="-1"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="tmsg"></span><button class="btn" id="undo" type="button">Deshacer</button></div>
<div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt"></h2><p id="mp"></p><div class="mact"><button class="btn" type="button" id="mno">Cancelar</button><button class="btn red" type="button" id="myes">Sí</button></div></div></div>

<script src="app.js"></script>
</body>
</html>
